# Validation-selected PRISM configuration from the 2026-11-10 optimization study.
# Required variant: prism+soft_hg (pass explicitly; the variant field below is documentation).
# Run: python run_node.py --config configs/prism/optimized_20261110/texas.yaml --variant prism+soft_hg
dataset:
  name: texas
  type: webkb
  data_dir: data/raw/node/texas
  train_per_class: 8
  val_size: 36
  test_size: 107
  use_official_splits: true
model:
  model_type: prism
  dual_branch: true
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.5
  hop_k: 2
  structural_cap: 20
  structural_candidate_cap: 20
  structure_filter: true
  densify_k: 1
  densify_min_similarity: 0.3
  hyperedge_keep_ratio: 0.95
  hyperedge_score: coherence_coverage
  preserve_node_coverage: true
  knn_k: 8
  n_clusters: 16
  enabled_views:
  - structural
  - feature_knn
  - prototype
  gate_temperature: 1.8
  gate_residual: 0.1
  gate_mode: soft
  fusion_mode: embedding
  view_gate_prior:
    structural: 0.2
    feature_knn: 0.45
    prototype: 0.35
  prototype_method: kmeans
  prototype_soft_topk: 2
  private_gate_strength: 0.0
loss:
  lambda_align: 0.03
  lambda_var: 0.005
  lambda_decorrelation: 0.005
  lambda_elastic: 0.0
  lambda_view_ce: 0.0
  variance_gamma: 1.0
  elastic_margin: 0.12
  max_elastic_pairs: 4000
  distill_enabled: true
  distill_warmup_epochs: 5
  distill_temperature: 1.0
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  epochs: 100
  patience: 25
  grad_clip: 5.0
  selection: val
  save_training_history: true
  save_routing_diagnostics: false
seed: 2
seeds: &id001
- 2
- 8
- 9
variant: prism+soft_hg
optimization_record:
  selected_candidate: c0
  private_gate_strength: 0.0
  structure_filter: true
  selection: validation only
  final_split_seeds: *id001
