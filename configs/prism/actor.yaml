# Include the structural view so the structure-filter contribution is active.
dataset:
  name: actor
  type: actor
  data_dir: data/raw/node/actor
  train_per_class: 8
  val_size: 1000
  test_size: 3000
  use_official_splits: true
model:
  model_type: prism
  dual_branch: true
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.40
  hop_k: 2
  structural_cap: 32
  structural_candidate_cap: 48
  structure_filter: true
  densify_k: 4
  densify_min_similarity: 0.20
  hyperedge_keep_ratio: 0.80
  hyperedge_score: coherence_coverage
  preserve_node_coverage: true
  knn_k: 15
  n_clusters: 64
  enabled_views: [structural, feature_knn, prototype]
  gate_temperature: 1.8
  gate_residual: 0.10
  gate_mode: soft
  fusion_mode: embedding
  view_gate_prior:
    structural: 0.20
    feature_knn: 0.45
    prototype: 0.35
  prototype_method: kmeans
  prototype_soft_topk: 2
loss:
  lambda_align: 0.15
  lambda_var: 0.05
  lambda_decorrelation: 0.05
  lambda_elastic: 0.0
  lambda_view_ce: 0.10
  variance_gamma: 1.0
  elastic_margin: 0.10
  max_elastic_pairs: 12000
  distill_enabled: true
  distill_warmup_epochs: 5
  distill_temperature: 1.0
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  epochs: 120
  patience: 30
  grad_clip: 5.0
  selection: val
  save_training_history: true
  save_routing_diagnostics: true
seed: 0
seeds: [0, 1, 2, 3, 4]
