# PRISM starting configuration, not a tuned benchmark result.
dataset:
  name: cora
  type: citation
  data_dir: data/raw/cora
  train_per_class: 20
  val_size: 500
  test_size: 1000
model:
  model_type: prism
  dual_branch: true
  hidden_dim: 128
  proj_dim: 64
  K: 3
  dropout: 0.30
  hop_k: 2
  structural_cap: 32
  structural_candidate_cap: 48
  structure_filter: true
  densify_k: 4
  densify_min_similarity: 0.20
  hyperedge_keep_ratio: 0.80
  hyperedge_score: coherence_coverage
  preserve_node_coverage: true
  knn_k: 10
  n_clusters: 32
  enabled_views: [structural, feature_knn, prototype]
  gate_temperature: 2.0
  gate_residual: 0.15
  gate_mode: soft
  fusion_mode: embedding
  view_gate_prior:
    structural: 0.45
    feature_knn: 0.35
    prototype: 0.20
  prototype_method: kmeans
  prototype_soft_topk: 2
loss:
  lambda_align: 0.20
  lambda_var: 0.05
  lambda_decorrelation: 0.05
  lambda_elastic: 0.0
  lambda_view_ce: 0.10
  variance_gamma: 1.0
  elastic_margin: 0.12
  max_elastic_pairs: 8000
  distill_enabled: true
  distill_warmup_epochs: 5
  distill_temperature: 1.0
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  epochs: 100
  patience: 25
  grad_clip: 5.0
  selection: val
  save_training_history: true
  save_routing_diagnostics: true
seed: 0
seeds: [0, 1, 2, 3, 4]
